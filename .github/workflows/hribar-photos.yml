name: Hribar species photos
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/hribar-photos.yml', 'hribar/scripts/fetch_photos.py']
permissions:
  contents: write
concurrency: hribar-photos
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: hribar } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch iNaturalist photos
        run: python3 scripts/fetch_photos.py 2>&1 | tee photos.log
      - name: Commit
        if: always()
        run: |
          git config user.name "hribar-bot"
          git config user.email "hribar-bot@users.noreply.github.com"
          tail -c 3000 photos.log > eval/data/photos_status.txt || true
          git add eval/data/photos_status.txt data/thumbs.json data/photos 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: species photos from iNaturalist $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep $((i*7)); done
