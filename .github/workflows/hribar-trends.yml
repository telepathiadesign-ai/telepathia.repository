name: Hribar search trends
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/hribar-trends.yml', 'hribar/scripts/fetch_trends.py']
permissions:
  contents: write
concurrency: hribar-trends
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: hribar } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytrends pandas 'urllib3<2'
      - name: Fetch Google Trends (Romania)
        id: tr
        run: |
          set -o pipefail
          python3 scripts/fetch_trends.py 2>&1 | tee trends.log
      - name: Commit
        if: always()
        run: |
          git config user.name "hribar-bot"
          git config user.email "hribar-bot@users.noreply.github.com"
          tail -c 3000 trends.log > eval/data/trends_status.txt || true
          git add eval/data/trends_status.txt; [ -f eval/data/trends_ro.json ] && git add eval/data/trends_ro.json
          git diff --cached --quiet || git commit -m "eval: Google Trends RO $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep $((i*7)); done
