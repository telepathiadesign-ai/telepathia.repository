name: Hribar archived forecasts
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/hribar-histwx.yml', 'hribar/scripts/fetch_hist_forecast.py']
permissions:
  contents: write
concurrency: hribar-histwx
jobs:
  histwx:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: hribar } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch archived Open-Meteo forecasts at the 40 nodes
        id: hw
        run: |
          set -o pipefail
          python3 scripts/fetch_hist_forecast.py 2>&1 | tee histwx.log
      - name: Commit
        if: always()
        run: |
          git config user.name "hribar-bot"
          git config user.email "hribar-bot@users.noreply.github.com"
          tail -c 4000 histwx.log > eval/data/hist_forecast_status.txt || true
          git add eval/data/hist_forecast_status.txt; [ -f eval/data/hist_forecast.json ] && git add eval/data/hist_forecast.json
          git diff --cached --quiet || git commit -m "eval: archived forecasts at nodes $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep $((i*7)); done
