name: Hribar map layers
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/hribar-layers.yml', 'hribar/scripts/build_landcover.py']
permissions:
  contents: write
concurrency: hribar-layers
jobs:
  landcover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: hribar } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install rasterio numpy
      - name: Build land-cover shares from ESA WorldCover
        id: lc
        run: |
          set -o pipefail
          python3 scripts/build_landcover.py 2>&1 | tee landcover.log
      - name: Commit
        if: always()
        run: |
          git config user.name "hribar-bot"
          git config user.email "hribar-bot@users.noreply.github.com"
          tail -c 3000 landcover.log > data/landcover_status.txt || true
          git add data/landcover_status.txt
          if [ "${{ steps.lc.outcome }}" = "success" ]; then git add data/landcover.json; fi
          git diff --cached --quiet || git commit -m "layers: ESA WorldCover land cover $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
